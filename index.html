<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem Solving Sessions</title>
  <meta name="description"
    content="Weekly problem solving sessions covering programming fundamentals, data structures, and algorithms.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* ─── Reset ─── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #111111;
      --bg-elevated: #191919;
      --bg-hover: #1f1f1f;
      --surface: #161616;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.1);
      --text: #e5e5e5;
      --text-2: #888888;
      --text-3: #555555;
      --accent: #e8c364;
      --accent-soft: rgba(232, 195, 100, 0.08);
      --green: #4ade80;
      --green-soft: rgba(74, 222, 128, 0.08);
      --yellow: #facc15;
      --yellow-soft: rgba(250, 204, 21, 0.08);
      --radius: 12px;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ─── Grain Overlay ─── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      z-index: 9999;
    }

    /* ─── Nav ─── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(17, 17, 17, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--accent);
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.03em;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-2);
      text-decoration: none;
      transition: color 0.2s var(--ease), background 0.2s var(--ease);
    }

    .nav-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-link svg {
      width: 15px;
      height: 15px;
    }

    /* ─── Hero ─── */
    .hero {
      max-width: 960px;
      margin: 0 auto;
      padding: 80px 24px 56px;
    }

    .level-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text);
    }

    .hero p {
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--text-2);
      max-width: 480px;
      line-height: 1.65;
    }

    /* ─── Sessions ─── */
    .sessions {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .section-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .section-label span:first-child {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .section-label span:last-child {
      font-size: 0.75rem;
      color: var(--text-3);
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    /* ─── Card ─── */
    .card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      transition: border-color 0.25s var(--ease),
                  background 0.25s var(--ease),
                  transform 0.3s var(--ease),
                  box-shadow 0.3s var(--ease);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }

    .card:hover {
      border-color: var(--border-hover);
      background: var(--bg-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:hover .card-go {
      opacity: 1;
      transform: translateX(0);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-num {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-3);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-badge.available {
      background: var(--green-soft);
      color: var(--green);
    }

    .card-badge.coming-soon {
      background: var(--yellow-soft);
      color: var(--yellow);
    }

    .card-badge-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 18px;
      flex: 1;
    }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.7rem;
      color: var(--text-2);
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }

    .card-go {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      display: grid;
      place-items: center;
      color: var(--text-2);
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
      flex-shrink: 0;
    }

    .card-go svg {
      width: 14px;
      height: 14px;
    }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      .hero { padding: 56px 20px 40px; }
      .sessions { padding: 0 20px 60px; }
      .grid { grid-template-columns: 1fr; }
      .nav-link span { display: none; }
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

    /* ─── Fade-in animation ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeUp 0.4s var(--ease) both;
    }
  </style>
</head>

<body>
  <!-- Nav -->
  <nav>
    <div class="nav-inner">
      <a href="./" class="brand">
        <span class="brand-mark">PS</span>
        <span>Problem Solving</span>
      </a>
      <a href="https://github.com/mohabnaser/problem-solving-sessions" class="nav-link" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="level-tag">Level 0 — Foundations</div>
    <h1>Problem Solving<br>Sessions</h1>
    <p>Weekly sessions covering programming fundamentals — from data types to algorithms and data structures.</p>
  </section>

  <!-- Sessions -->
  <section class="sessions">
    <div class="section-label">
      <span>Sessions</span>
      <span id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <script>
    const sessions = [
      {
        week: 1,
        title: "Data Types & Operators",
        description: "How code thinks about data — primitive types, type conversions, and working with arithmetic, comparison, and logical operators.",
        tags: ["int", "float", "string", "bool", "operators"],
        file: "how-code-thinks-about-data.html",
        status: "available"
      },
      {
        week: 2,
        title: "Conditions",
        description: "How programs make decisions — if/else statements, comparison operators, logical operators, and nested conditions.",
        tags: ["if", "else", "else if", "logical operators"],
        file: "conditions-session.html",
        status: "available"
      },
      {
        week: 3,
        title: "Loops",
        description: "How code repeats — for loops, while loops, do-while loops, nested loops, and controlling flow with break and continue.",
        tags: ["for", "while", "do-while", "break", "continue"],
        file: "loops.html",
        status: "available"
      },
    ];

    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const available = sessions.filter(s => s.status === "available").length;
    countEl.textContent = `${available} / ${sessions.length}`;

    sessions.forEach((s, i) => {
      const ok = s.status === "available" && s.file;
      const card = document.createElement("a");
      card.className = "card";
      card.id = `session-week-${s.week}`;
      card.style.animationDelay = `${i * 0.08}s`;

      if (ok) {
        card.href = s.file;
      } else {
        card.style.cursor = "default";
        card.addEventListener("click", e => e.preventDefault());
      }

      card.innerHTML = `
        <div class="card-head">
          <span class="card-num">W${String(s.week).padStart(2, '0')}</span>
          <span class="card-badge ${s.status}">
            <span class="card-badge-dot"></span>
            ${s.status === "available" ? "Available" : "Coming Soon"}
          </span>
        </div>
        <div class="card-title">${s.title}</div>
        <div class="card-desc">${s.description}</div>
        <div class="card-foot">
          <div class="card-tags">
            ${s.tags.map(t => `<span class="tag">${t}</span>`).join("")}
          </div>
          ${ok ? `
            <span class="card-go">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 3l5 5-5 5"/>
              </svg>
            </span>
          ` : ""}
        </div>
      `;

      grid.appendChild(card);
    });
  </script>
</body>

</html>
